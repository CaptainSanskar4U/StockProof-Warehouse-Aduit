<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Apply saved Inspector Panel theme before first paint — no flash. Default: light.
      document.addEventListener('DOMContentLoaded', function () {
        try {
          document.body.classList.add(
            localStorage.getItem('stockproof-theme') === 'dark' ? 'dark-mode' : 'light-mode'
          );
        } catch (e) {
          document.body.classList.add('light-mode');
        }
      });
    </script>
    <title>STOCKPROOF — Grain Warehouse Stock Verification</title>
